<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шаблоны демо</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;padding:48px 24px;background:#0d0f10;color:#f0f1f3;
    font:16px/1.6 -apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:-.02em}
  p.sub{color:rgba(240,241,243,.6);margin:0 0 36px}
  a.card{
    display:block;padding:22px 24px;margin-bottom:14px;
    border:1px solid rgba(240,241,243,.16);border-radius:12px;
    color:inherit;text-decoration:none;transition:border-color .2s ease,background .2s ease;
  }
  a.card:hover{border-color:rgba(240,241,243,.4);background:rgba(240,241,243,.04)}
  a.card b{display:block;font-size:19px;letter-spacing:-.01em;margin-bottom:4px}
  a.card span{color:rgba(240,241,243,.6);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Демо-шаблоны</h1>
  <p class="sub">Данные внутри выдуманы и служат заглушкой. Перед отправкой клиенту заменяются на его.</p>

  <a class="card" href="villa/">
    <b>Villa Sawah</b>
    <span>Аренда виллы. Заголовок перекрыт постройкой, аннотации поверх кадра.</span>
  </a>

  <a class="card" href="detailing/">
    <b>GRAFIT Detailing</b>
    <span>Детейлинг-студия. Тёмный первый экран, прайс, работы, запись.</span>
  </a>
</div>
</body>
</html>
